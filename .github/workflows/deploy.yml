# Deploy Cloud Run via deploy/*.sh. Workers already ship through Wrangler git
# integration — do not add a Wrangler job here.
#
# Auth credentials and deploy targets (PROJECT, SERVICE, IMAGE) come from
# GitHub secrets. Do not put those values in this file.

name: Deploy Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloud-run-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  staging:
    name: Deploy staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_STAGING }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Deploy staging
        env:
          PROJECT: ${{ secrets.GCP_PROJECT_STAGING }}
          SERVICE: ${{ secrets.GCP_SERVICE_STAGING }}
          IMAGE: ${{ secrets.GCP_IMAGE_STAGING }}
        run: bash deploy/staging.sh

  prod:
    name: Deploy prod
    needs: staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_PROD }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Deploy prod
        env:
          PROJECT: ${{ secrets.GCP_PROJECT_PROD }}
          SERVICE: ${{ secrets.GCP_SERVICE_PROD }}
          IMAGE: ${{ secrets.GCP_IMAGE_PROD }}
        run: bash deploy/prod.sh
